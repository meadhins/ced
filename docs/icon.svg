<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Dial Bezel -->
  <circle cx="256" cy="256" r="208" fill="#111827" stroke="#334155" stroke-width="6" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Swept Arc indicator -->
  <path d="M 256 96 A 160 160 0 0 1 395 336" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" opacity="0.85" />

  <!-- Major Dial Ticks -->
  <!-- Top 0° tick (double marker) -->
  <line x1="252" y1="64" x2="252" y2="88" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
  <line x1="260" y1="64" x2="260" y2="88" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
  <!-- Cardinal 90° -->
  <line x1="424" y1="256" x2="448" y2="256" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  <!-- Cardinal 180° -->
  <line x1="256" y1="424" x2="256" y2="448" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  <!-- Cardinal 270° -->
  <line x1="64" y1="256" x2="88" y2="256" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

  <!-- Minor Ticks -->
  <circle cx="352" cy="120" r="3" fill="#94a3b8" />
  <circle cx="392" cy="192" r="3" fill="#94a3b8" />
  <circle cx="392" cy="320" r="3" fill="#94a3b8" />
  <circle cx="352" cy="392" r="3" fill="#94a3b8" />
  <circle cx="160" cy="392" r="3" fill="#94a3b8" />
  <circle cx="120" cy="320" r="3" fill="#94a3b8" />
  <circle cx="120" cy="192" r="3" fill="#94a3b8" />
  <circle cx="160" cy="120" r="3" fill="#94a3b8" />

  <!-- Rotating Hand tilted at ~42 degrees -->
  <g transform="rotate(42 256 256)">
    <!-- Counterweight -->
    <path d="M 252 256 L 252 300 A 4 4 0 0 0 260 300 L 260 256 Z" fill="#64748b" />
    <circle cx="256" cy="305" r="9" fill="none" stroke="#64748b" stroke-width="3" />
    
    <!-- Needle Blade -->
    <polygon points="253,256 254.5,72 256,60 257.5,72 259,256" fill="url(#needle)" />
    <line x1="256" y1="256" x2="256" y2="65" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Center Pivot -->
    <circle cx="256" cy="256" r="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="256" cy="256" r="9" fill="#0f172a" />
    <circle cx="256" cy="256" r="4" fill="#f97316" />
  </g>
</svg>
