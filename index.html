<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cadence — Repetition Timing Aid</title>
    <meta name="description" content="A calm, circular visual timing instrument for pacing and tracking repetitive activities." />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <style>
      /* --- Pure, Robust Self-Contained Styles (Zero CDN dependency) --- */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-page: #f8fafc;
        --bg-surface: #ffffff;
        --border-color: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --brand-orange: #ea580c;
        --brand-amber: #d97706;
        --dial-bezel-stroke: #cbd5e1;
        --dial-face-stroke: #e2e8f0;
        --dial-guide: #f1f5f9;
        --dial-badge-bg: #ffffff;
        --dial-badge-stroke: #e2e8f0;
        --dial-badge-text: #0f172a;
        --hub-outer: #e2e8f0;
        --hub-stroke: #cbd5e1;
        --hub-inner: #ffffff;
        --btn-secondary-bg: #ffffff;
        --btn-secondary-border: #cbd5e1;
        --btn-secondary-hover: #f1f5f9;
        --control-bar-bg: #f1f5f9;
        --control-bar-border: #e2e8f0;
      }

      html.dark {
        --bg-page: #020617;
        --bg-surface: #0b0f19;
        --border-color: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --brand-orange: #f97316;
        --brand-amber: #fbbf24;
        --dial-bezel-stroke: #334155;
        --dial-face-stroke: #1e293b;
        --dial-guide: rgba(255, 255, 255, 0.04);
        --dial-badge-bg: #111726;
        --dial-badge-stroke: #1e293b;
        --dial-badge-text: #f8fafc;
        --hub-outer: #334155;
        --hub-stroke: #475569;
        --hub-inner: #090d16;
        --btn-secondary-bg: #0f172a;
        --btn-secondary-border: #1e293b;
        --btn-secondary-hover: #1e293b;
        --control-bar-bg: #0f172a;
        --control-bar-border: #1e293b;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-primary);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* App Shell */
      #app-root {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      /* Header */
      header {
        width: 100%;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-page);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .brand-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-duration {
        font-size: 11px;
        color: var(--text-muted);
        margin-left: 4px;
      }

      .action-tools {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tool-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .tool-btn:hover {
        background: var(--control-bar-bg);
        color: var(--text-primary);
      }

      .theme-btn {
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--btn-secondary-border);
        background: var(--btn-secondary-bg);
        color: var(--text-primary);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      /* Main Dial Section */
      main {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      /* 3-Layer Performance Dial Container */
      .dial-container {
        width: min(86vw, 48vh, 380px);
        height: min(86vw, 48vh, 380px);
        max-width: 380px;
        max-height: 380px;
        aspect-ratio: 1 / 1;
        position: relative;
        margin: 0 auto;
        border-radius: 50%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      .dial-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .dial-static-layer {
        pointer-events: none;
      }

      .dial-arc-layer {
        pointer-events: none;
      }

      .dial-hand-layer {
        cursor: grab;
        touch-action: none;
        transform: rotate(0deg);
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .dial-hand-layer:active,
      .dial-hand-layer.dragging {
        cursor: grabbing;
      }

      /* Control Dock (Bottom) */
      .control-dock {
        width: 100%;
        max-width: 380px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Primary Action Buttons */
      .primary-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-start {
        flex: 1;
        min-height: 52px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background: var(--brand-orange);
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
        transition: transform 0.1s ease, background-color 0.15s ease;
      }

      .btn-start:hover {
        background: #dc2626;
      }

      .btn-start:active {
        transform: scale(0.98);
      }

      .btn-start.running {
        background: #e11d48;
        box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
      }

      .btn-reset {
        min-height: 52px;
        padding: 0 20px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--btn-secondary-border);
        background: var(--btn-secondary-bg);
        color: var(--text-secondary);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn-reset:hover:not(:disabled) {
        background: var(--btn-secondary-hover);
        color: var(--text-primary);
      }

      .btn-reset:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* Settings Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      .modal-card {
        width: 100%;
        max-width: 480px;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 20px 20px 0 0;
        padding: 20px;
        transform: translateY(100%);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        max-height: 85vh;
        overflow-y: auto;
      }

      .modal-backdrop.open .modal-card {
        transform: translateY(0);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .modal-title {
        font-size: 16px;
        font-weight: 700;
      }

      .modal-close {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: var(--control-bar-bg);
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .custom-sec-wrapper {
        margin: 16px 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .custom-input-box {
        flex: 1;
        position: relative;
      }

      .custom-sec-input {
        width: 100%;
        height: 44px;
        padding: 0 44px 0 14px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--control-bar-bg);
        color: var(--text-primary);
        font-size: 16px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, monospace;
        outline: none;
        transition: border-color 0.15s ease;
      }

      .custom-sec-input:focus {
        border-color: var(--brand-orange);
      }

      .custom-input-unit {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 600;
        pointer-events: none;
      }

      .btn-set-custom {
        height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        border: none;
        background: var(--brand-orange);
        color: #ffffff;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .btn-set-custom:hover {
        opacity: 0.9;
      }

      .presets-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
      }

      .preset-card {
        padding: 12px 8px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-surface);
        text-align: center;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .preset-card:hover {
        border-color: var(--brand-orange);
      }

      .preset-card.active {
        border-color: var(--brand-orange);
        background: rgba(234, 88, 12, 0.08);
      }

      .preset-sec {
        font-size: 15px;
        font-weight: 700;
      }

      .preset-desc {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <!-- Top Navigation -->
      <header>
        <div style="display: flex; align-items: center;">
          <span class="brand-title">Cadence</span>
          <span id="header-duration-label" class="brand-duration">· 130s</span>
        </div>

        <div class="action-tools">
          <!-- Arc Track Toggle -->
          <button id="btn-toggle-arc" class="tool-btn" title="Toggle swept arc" aria-label="Toggle swept arc">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
          </button>

          <!-- Settings -->
          <button id="btn-open-settings" class="tool-btn" title="Duration settings" aria-label="Duration settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          </button>

          <!-- Fullscreen Toggle -->
          <button id="btn-toggle-fullscreen" class="tool-btn" title="Fullscreen" aria-label="Fullscreen">
            <svg id="icon-maximize" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <svg id="icon-minimize" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M14 4v6m0 0h6m-6 0L21 3M4 10h6m0 0V4m0 6L3 3"/></svg>
          </button>

          <!-- Light / Dark Theme Button -->
          <button id="btn-toggle-theme" class="theme-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
            <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="theme-icon-sun" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #fbbf24;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <span id="theme-label">Dark</span>
          </button>
        </div>
      </header>

      <!-- Main Dial Instrument Center -->
      <main>
        <!-- Dial Container with 3 Dedicated Layers -->
        <div class="dial-container" id="dial-container">
          <!-- Layer 1: Static Dial (Never repainted during drag) -->
          <svg id="dial-static-svg" class="dial-layer dial-static-layer" viewBox="0 0 400 400" role="img" aria-label="Cadence dial instrument">
            <defs>
              <radialGradient id="bezelGradientLight" cx="50%" cy="45%" r="50%">
                <stop offset="65%" stop-color="#f8fafc" />
                <stop offset="90%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#cbd5e1" />
              </radialGradient>
              <radialGradient id="bezelGradientDark" cx="50%" cy="45%" r="50%">
                <stop offset="65%" stop-color="#1e293b" />
                <stop offset="90%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#020617" />
              </radialGradient>
              <radialGradient id="faceGradientLight" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="85%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#f8fafc" />
              </radialGradient>
              <radialGradient id="faceGradientDark" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#090d16" />
                <stop offset="85%" stop-color="#090d16" />
                <stop offset="100%" stop-color="#05080e" />
              </radialGradient>
            </defs>

            <!-- Outer Bezel -->
            <circle id="dial-bezel" cx="200" cy="200" r="195" fill="url(#bezelGradientLight)" stroke="#cbd5e1" stroke-width="1.5" />
            <!-- Dial Face -->
            <circle id="dial-face" cx="200" cy="200" r="185" fill="url(#faceGradientLight)" stroke="#e2e8f0" stroke-width="1" />
            <!-- Concentric Outer Guide Ring -->
            <circle id="dial-guide-outer" cx="200" cy="200" r="176" fill="none" stroke="#f1f5f9" stroke-width="1" />
            <!-- Swept Arc Track (background dotted path) -->
            <circle id="arc-track-bg" cx="200" cy="200" r="142" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="3.5" stroke-dasharray="2 3" />
            <!-- Concentric Inner Guide Ring -->
            <circle id="dial-guide-inner" cx="200" cy="200" r="115" fill="none" stroke="#f1f5f9" stroke-width="1" />

            <!-- Dial Ticks (60 precision marks generated by JS) -->
            <g id="dial-ticks-group"></g>

            <!-- Top Indicator (12 o'clock / 0°) -->
            <circle cx="200" cy="38" r="3.2" fill="#ea580c" />
            <!-- Cardinal Sub-dots (3, 6, 9 o'clock) -->
            <circle cx="362" cy="200" r="1.5" fill="#94a3b8" />
            <circle cx="200" cy="362" r="1.5" fill="#94a3b8" />
            <circle cx="38" cy="200" r="1.5" fill="#94a3b8" />

            <!-- Center Revolution Counter Badge (Enlarged for effortless readability from distance) -->
            <g id="rev-counter-group" pointer-events="none">
              <rect id="badge-rect" x="132" y="96" width="136" height="76" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
              <text id="display-rev-number" x="200" y="146" text-anchor="middle" fill="#0f172a" font-size="46" font-weight="800" font-family="ui-monospace, monospace">1</text>
              <text id="display-pace-label" x="200" y="163" text-anchor="middle" fill="#ea580c" font-size="9" font-weight="700" letter-spacing="0.12em">ODD · 40% PACE</text>
            </g>
          </svg>

          <!-- Layer 2: Swept Arc Path (Isolated middle layer) -->
          <svg id="dial-arc-svg" class="dial-layer dial-arc-layer" viewBox="0 0 400 400" pointer-events="none">
            <path id="arc-progress-path" d="" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
          </svg>

          <!-- Layer 3: Hand Layer (Rotated as entire SVG element via GPU transform) -->
          <svg id="dial-hand-svg" class="dial-layer dial-hand-layer" viewBox="0 0 400 400">
            <g id="instrument-hand">
              <!-- Invisible enlarged grab area -->
              <line x1="200" y1="200" x2="200" y2="40" stroke="transparent" stroke-width="40" stroke-linecap="round" />
              <circle cx="200" cy="40" r="28" fill="transparent" />

              <!-- Counterweight Tail -->
              <line x1="200" y1="200" x2="200" y2="228" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="200" cy="228" r="3.5" fill="#475569" />

              <!-- Needle Blade -->
              <line id="needle-blade" x1="200" y1="200" x2="200" y2="44" stroke="#ea580c" stroke-width="2.75" stroke-linecap="round" />
              <!-- Sharp Arrow Point -->
              <polygon id="needle-arrow" points="197,50 200,38 203,50" fill="#ea580c" />
              <!-- Needle Grab Halo Ring -->
              <circle id="drag-halo" cx="200" cy="42" r="14" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="2 2" opacity="0" />
              <!-- Needle Tip Grab Dot -->
              <circle id="needle-tip" cx="200" cy="42" r="4.5" fill="#ea580c" />

              <!-- Central Pivot Hub -->
              <circle id="hub-outer" cx="200" cy="200" r="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
              <circle id="hub-inner" cx="200" cy="200" r="6" fill="#ffffff" />
              <circle id="hub-dot" cx="200" cy="200" r="2.5" fill="#ea580c" />
            </g>
          </svg>
        </div>
      </main>

      <!-- Bottom Control Dock -->
      <footer class="control-dock">
        <!-- Start / Stop and Reset Actions -->
        <div class="primary-actions">
          <button id="btn-start-stop" class="btn-start" aria-label="Start Cadence">
            <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="icon-stop" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            <span id="start-stop-label">Start</span>
          </button>

          <button id="btn-reset" class="btn-reset" aria-label="Reset chronometer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>Reset</span>
          </button>
        </div>
      </footer>
    </div>

    <!-- Duration Settings Modal -->
    <div id="modal-settings" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-title">Pacing Duration</span>
          <button id="btn-close-settings" class="modal-close" aria-label="Close">✕</button>
        </div>
        <p style="font-size: 12.5px; color: var(--text-secondary); line-height: 1.45;">
          Set total duration in seconds for two full revolutions (one 40% odd cycle and one 60% even cycle).
        </p>

        <!-- Custom Seconds Input -->
        <div class="custom-sec-wrapper">
          <div class="custom-input-box">
            <input type="number" id="input-custom-sec" min="10" max="3600" step="1" value="130" placeholder="130" class="custom-sec-input" />
            <span class="custom-input-unit">sec</span>
          </div>
          <button id="btn-apply-custom-sec" class="btn-set-custom">Set</button>
        </div>

        <!-- Preset Options -->
        <div class="presets-grid">
          <div class="preset-card active" data-sec="130">
            <div class="preset-sec">130s</div>
            <div class="preset-desc">Standard</div>
          </div>
          <div class="preset-card" data-sec="120">
            <div class="preset-sec">120s</div>
            <div class="preset-desc">2 min (Brisk)</div>
          </div>
          <div class="preset-card" data-sec="180">
            <div class="preset-sec">180s</div>
            <div class="preset-desc">3 min</div>
          </div>
          <div class="preset-card" data-sec="240">
            <div class="preset-sec">240s</div>
            <div class="preset-desc">4 min</div>
          </div>
          <div class="preset-card" data-sec="90">
            <div class="preset-sec">90s</div>
            <div class="preset-desc">1.5 min</div>
          </div>
          <div class="preset-card" data-sec="300">
            <div class="preset-sec">300s</div>
            <div class="preset-desc">5 min</div>
          </div>
        </div>
      </div>
    </div>

    <!-- High-Performance 60FPS Drag & Render Logic -->
    <script>
      (function() {
        const DEFAULT_TOTAL_SEC = 130;
        const ODD_RATIO = 0.40;
        const EVEN_RATIO = 0.60;

        let savedSec = parseInt(localStorage.getItem('cadence_two_rev_total'), 10);
        // Default to 130s (resetting previous default of 180s if uncustomized)
        let twoRevTotalSec = (savedSec && savedSec !== 180) ? savedSec : DEFAULT_TOTAL_SEC;
        let revNumber = 1;
        let handAngleDegrees = 0;
        let isRunning = false;
        let showSweepArc = true;
        let isDragging = false;
        let lastDragAngle = 0;
        let lastTimestamp = null;
        let animFrameId = null;
        let wakeLock = null;

        // Cached drag geometry
        let cachedCenterX = 0;
        let cachedCenterY = 0;
        let dragRafScheduled = false;

        // Elements
        const dialContainer = document.getElementById('dial-container');
        const dialBezel = document.getElementById('dial-bezel');
        const dialFace = document.getElementById('dial-face');
        const dialGuideOuter = document.getElementById('dial-guide-outer');
        const dialGuideInner = document.getElementById('dial-guide-inner');
        const arcTrackBg = document.getElementById('arc-track-bg');
        const arcProgressPath = document.getElementById('arc-progress-path');
        const ticksGroup = document.getElementById('dial-ticks-group');
        const badgeRect = document.getElementById('badge-rect');
        const displayRevNumber = document.getElementById('display-rev-number');
        const displayPaceLabel = document.getElementById('display-pace-label');

        const dialHandSvg = document.getElementById('dial-hand-svg');
        const needleBlade = document.getElementById('needle-blade');
        const needleArrow = document.getElementById('needle-arrow');
        const needleTip = document.getElementById('needle-tip');
        const hubOuter = document.getElementById('hub-outer');
        const hubInner = document.getElementById('hub-inner');
        const hubDot = document.getElementById('hub-dot');
        const dragHalo = document.getElementById('drag-halo');

        const headerDurationLabel = document.getElementById('header-duration-label');

        const btnStartStop = document.getElementById('btn-start-stop');
        const startStopLabel = document.getElementById('start-stop-label');
        const iconPlay = document.getElementById('icon-play');
        const iconStop = document.getElementById('icon-stop');
        const btnReset = document.getElementById('btn-reset');

        const btnToggleArc = document.getElementById('btn-toggle-arc');
        const btnToggleFullscreen = document.getElementById('btn-toggle-fullscreen');
        const iconMaximize = document.getElementById('icon-maximize');
        const iconMinimize = document.getElementById('icon-minimize');

        const btnToggleTheme = document.getElementById('btn-toggle-theme');
        const themeIconSun = document.getElementById('theme-icon-sun');
        const themeIconMoon = document.getElementById('theme-icon-moon');
        const themeLabel = document.getElementById('theme-label');

        const modalSettings = document.getElementById('modal-settings');
        const btnOpenSettings = document.getElementById('btn-open-settings');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        const presetCards = document.querySelectorAll('.preset-card');
        const inputCustomSec = document.getElementById('input-custom-sec');
        const btnApplyCustomSec = document.getElementById('btn-apply-custom-sec');

        // Geometry Helpers
        function polarToCartesian(cx, cy, r, angleDeg) {
          const rad = (angleDeg - 90) * Math.PI / 180;
          return {
            x: cx + r * Math.cos(rad),
            y: cy + r * Math.sin(rad)
          };
        }

        function describeArc(x, y, radius, startAngle, endAngle) {
          const delta = endAngle - startAngle;
          if (delta <= 0.05) return '';
          const clampedEnd = delta >= 359.99 ? startAngle + 359.99 : endAngle;
          const start = polarToCartesian(x, y, radius, startAngle);
          const end = polarToCartesian(x, y, radius, clampedEnd);
          const largeArcFlag = delta <= 180 ? '0' : '1';
          return ['M', start.x, start.y, 'A', radius, radius, 0, largeArcFlag, 1, end.x, end.y].join(' ');
        }

        // --- Theme Management ---
        let currentTheme = localStorage.getItem('cadence_theme') || 'light';
        if (currentTheme !== 'light' && currentTheme !== 'dark') currentTheme = 'light';

        function applyTheme(theme) {
          currentTheme = theme;
          localStorage.setItem('cadence_theme', theme);
          const isDark = (theme === 'dark');

          if (isDark) {
            document.documentElement.classList.add('dark');
            themeIconSun.classList.remove('hidden');
            themeIconMoon.classList.add('hidden');
            themeLabel.textContent = 'Light';

            dialBezel.setAttribute('fill', 'url(#bezelGradientDark)');
            dialBezel.setAttribute('stroke', '#334155');
            dialFace.setAttribute('fill', 'url(#faceGradientDark)');
            dialFace.setAttribute('stroke', '#1e293b');
            dialGuideOuter.setAttribute('stroke', 'rgba(255,255,255,0.04)');
            dialGuideInner.setAttribute('stroke', 'rgba(255,255,255,0.04)');
            arcTrackBg.setAttribute('stroke', 'rgba(255,255,255,0.06)');
            badgeRect.setAttribute('fill', '#111726');
            badgeRect.setAttribute('stroke', '#1e293b');
            displayRevNumber.setAttribute('fill', '#f8fafc');
            hubOuter.setAttribute('fill', '#334155');
            hubOuter.setAttribute('stroke', '#475569');
            hubInner.setAttribute('fill', '#090d16');
          } else {
            document.documentElement.classList.remove('dark');
            themeIconSun.classList.add('hidden');
            themeIconMoon.classList.remove('hidden');
            themeLabel.textContent = 'Dark';

            dialBezel.setAttribute('fill', 'url(#bezelGradientLight)');
            dialBezel.setAttribute('stroke', '#cbd5e1');
            dialFace.setAttribute('fill', 'url(#faceGradientLight)');
            dialFace.setAttribute('stroke', '#e2e8f0');
            dialGuideOuter.setAttribute('stroke', '#f1f5f9');
            dialGuideInner.setAttribute('stroke', '#f1f5f9');
            arcTrackBg.setAttribute('stroke', 'rgba(15,23,42,0.06)');
            badgeRect.setAttribute('fill', '#ffffff');
            badgeRect.setAttribute('stroke', '#e2e8f0');
            displayRevNumber.setAttribute('fill', '#0f172a');
            hubOuter.setAttribute('fill', '#e2e8f0');
            hubOuter.setAttribute('stroke', '#cbd5e1');
            hubInner.setAttribute('fill', '#ffffff');
          }

          renderTicks();
          updateRevUI();
          renderHandAndArc();
        }

        btnToggleTheme.addEventListener('click', () => {
          applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        });

        // 60 Tick Marks (Rendered once per theme switch)
        function renderTicks() {
          ticksGroup.innerHTML = '';
          const cx = 200, cy = 200, outerR = 176;
          const isDark = (currentTheme === 'dark');

          for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isTop = (i === 0);
            const isCardinal = (i % 15 === 0);
            const isMajor = (i % 5 === 0);

            let innerR, strokeWidth, strokeColor, opacity;

            if (isTop) {
              innerR = 154;
              strokeWidth = 3;
              strokeColor = '#ea580c';
              opacity = 1;
            } else if (isCardinal) {
              innerR = 158;
              strokeWidth = 2.5;
              strokeColor = isDark ? '#f8fafc' : '#0f172a';
              opacity = 0.95;
            } else if (isMajor) {
              innerR = 163;
              strokeWidth = 1.75;
              strokeColor = isDark ? '#f8fafc' : '#0f172a';
              opacity = 0.75;
            } else {
              innerR = 168;
              strokeWidth = 1;
              strokeColor = isDark ? '#64748b' : '#94a3b8';
              opacity = 0.4;
            }

            const p1 = polarToCartesian(cx, cy, outerR, angle);
            const p2 = polarToCartesian(cx, cy, innerR, angle);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', strokeColor);
            line.setAttribute('stroke-width', strokeWidth);
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('opacity', opacity);
            ticksGroup.appendChild(line);
          }
        }

        // --- Fast Render: Hand rotation & Arc ONLY (Zero DOM/text rebuild) ---
        function renderHandAndArc() {
          dragRafScheduled = false;
          dialHandSvg.style.transform = `rotate(${handAngleDegrees}deg)`;

          if (showSweepArc && handAngleDegrees > 0.1) {
            arcProgressPath.style.display = 'block';
            arcProgressPath.setAttribute('d', describeArc(200, 200, 142, 0, Math.min(handAngleDegrees, 359.9)));
          } else {
            arcProgressPath.style.display = 'none';
          }
        }

        // --- Revolution State UI: Called ONLY when rev number changes or drag ends ---
        function updateRevUI() {
          const isOdd = (revNumber % 2 !== 0);
          const paceColor = isOdd ? '#ea580c' : '#d97706';

          needleBlade.setAttribute('stroke', paceColor);
          if (needleArrow) needleArrow.setAttribute('fill', paceColor);
          needleTip.setAttribute('fill', paceColor);
          hubDot.setAttribute('fill', paceColor);
          dragHalo.setAttribute('stroke', paceColor);
          arcProgressPath.setAttribute('stroke', paceColor);

          displayRevNumber.textContent = revNumber;
          displayPaceLabel.textContent = isOdd ? 'ODD · 40% PACE' : 'EVEN · 60% PACE';
          displayPaceLabel.setAttribute('fill', paceColor);

          btnReset.disabled = (handAngleDegrees === 0 && revNumber === 1 && !isRunning);
        }

        function updateFullUI() {
          updateRevUI();
          headerDurationLabel.textContent = `· ${twoRevTotalSec}s`;
          if (inputCustomSec) inputCustomSec.value = twoRevTotalSec;

          presetCards.forEach((card) => {
            const sec = parseInt(card.dataset.sec, 10);
            card.classList.toggle('active', sec === twoRevTotalSec);
          });
        }

        function setDurationSec(newSec) {
          if (!isNaN(newSec) && newSec >= 10 && newSec <= 3600) {
            twoRevTotalSec = Math.round(newSec);
            localStorage.setItem('cadence_two_rev_total', twoRevTotalSec.toString());
            updateFullUI();
            renderHandAndArc();
            closeSettingsModal();
          }
        }

        // --- Animation Loop ---
        function tick(now) {
          if (!isRunning) return;
          if (lastTimestamp === null) lastTimestamp = now;

          const deltaMs = now - lastTimestamp;
          lastTimestamp = now;

          if (!isDragging) {
            const isOdd = (revNumber % 2 !== 0);
            const cycleDurationSec = isOdd ? twoRevTotalSec * ODD_RATIO : twoRevTotalSec * EVEN_RATIO;
            const degPerMs = 360 / (cycleDurationSec * 1000);
            let nextAngle = handAngleDegrees + degPerMs * deltaMs;
            let revChanged = false;

            if (nextAngle >= 360) {
              nextAngle = nextAngle % 360;
              revNumber += 1;
              revChanged = true;
            }

            handAngleDegrees = nextAngle;
            renderHandAndArc();

            if (revChanged) {
              updateRevUI();
            }
          }

          animFrameId = requestAnimationFrame(tick);
        }

        async function requestWakeLock() {
          if ('wakeLock' in navigator && !wakeLock) {
            try {
              wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
          }
        }

        function releaseWakeLock() {
          if (wakeLock) {
            try { wakeLock.release(); } catch (err) {}
            wakeLock = null;
          }
        }

        // Fullscreen launcher helper
        function tryAutoFullscreen() {
          try {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
              const docEl = document.documentElement;
              const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
              if (req) {
                req.call(docEl).catch(() => {});
              }
            }
          } catch (err) {}
        }

        function startLoop() {
          if (isRunning) return;
          isRunning = true;
          lastTimestamp = performance.now();
          requestWakeLock();
          tryAutoFullscreen();
          btnStartStop.classList.add('running');
          startStopLabel.textContent = 'Stop';
          iconPlay.classList.add('hidden');
          iconStop.classList.remove('hidden');
          animFrameId = requestAnimationFrame(tick);
          updateFullUI();
        }

        function stopLoop() {
          if (!isRunning) return;
          isRunning = false;
          if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
          }
          lastTimestamp = null;
          releaseWakeLock();
          btnStartStop.classList.remove('running');
          startStopLabel.textContent = 'Start';
          iconPlay.classList.remove('hidden');
          iconStop.classList.add('hidden');
          updateFullUI();
        }

        function resetChronometer() {
          stopLoop();
          handAngleDegrees = 0;
          revNumber = 1;
          renderHandAndArc();
          updateFullUI();
        }

        // --- High-Performance Cached Angle Math ---
        function getAngleFromCoords(clientX, clientY) {
          const dx = clientX - cachedCenterX;
          const dy = clientY - cachedCenterY;
          let deg = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
          if (deg < 0) deg += 360;
          return deg % 360;
        }

        function onHandPointerDown(e) {
          e.stopPropagation();
          try {
            dialHandSvg.setPointerCapture(e.pointerId);
          } catch (err) {}

          dialHandSvg.classList.add('dragging');
          isDragging = true;

          // Cache center coordinates ONCE at start of gesture
          const rect = dialContainer.getBoundingClientRect();
          cachedCenterX = rect.left + rect.width / 2;
          cachedCenterY = rect.top + rect.height / 2;

          lastDragAngle = getAngleFromCoords(e.clientX, e.clientY);
          dragHalo.style.opacity = '1';
        }

        function onHandPointerMove(e) {
          if (!isDragging) return;
          const currentAngle = getAngleFromCoords(e.clientX, e.clientY);

          let revChanged = false;
          if (lastDragAngle > 270 && currentAngle < 90) {
            revNumber += 1;
            revChanged = true;
          } else if (lastDragAngle < 90 && currentAngle > 270) {
            revNumber = Math.max(1, revNumber - 1);
            revChanged = true;
          }

          lastDragAngle = currentAngle;
          handAngleDegrees = currentAngle;

          if (revChanged) {
            updateRevUI();
          }

          if (!dragRafScheduled) {
            dragRafScheduled = true;
            requestAnimationFrame(renderHandAndArc);
          }
        }

        function onHandPointerUp(e) {
          if (!isDragging) return;
          try {
            dialHandSvg.releasePointerCapture(e.pointerId);
          } catch (err) {}

          dialHandSvg.classList.remove('dragging');
          isDragging = false;
          dragHalo.style.opacity = '0';
          lastTimestamp = performance.now();

          renderHandAndArc();
          updateFullUI();
        }

        dialHandSvg.addEventListener('pointerdown', onHandPointerDown);
        dialHandSvg.addEventListener('pointermove', onHandPointerMove);
        dialHandSvg.addEventListener('pointerup', onHandPointerUp);
        dialHandSvg.addEventListener('pointercancel', onHandPointerUp);

        // --- Button Events ---
        btnStartStop.addEventListener('click', () => {
          if (isRunning) stopLoop();
          else startLoop();
        });

        btnReset.addEventListener('click', resetChronometer);

        btnToggleArc.addEventListener('click', () => {
          showSweepArc = !showSweepArc;
          arcTrackBg.style.display = showSweepArc ? 'block' : 'none';
          btnToggleArc.style.color = showSweepArc ? 'var(--brand-orange)' : 'var(--text-muted)';
          renderHandAndArc();
        });

        // Fullscreen manual toggle
        function toggleFullscreen() {
          try {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
              const docEl = document.documentElement;
              const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
              if (req) req.call(docEl).catch(() => {});
            } else {
              const exit = document.exitFullscreen || document.webkitExitFullscreen;
              if (exit) exit.call(document).catch(() => {});
            }
          } catch (err) {}
        }

        btnToggleFullscreen.addEventListener('click', toggleFullscreen);

        function syncFullscreenIcons() {
          const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
          iconMaximize.classList.toggle('hidden', isFS);
          iconMinimize.classList.toggle('hidden', !isFS);
        }

        document.addEventListener('fullscreenchange', syncFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', syncFullscreenIcons);

        // Settings Modal
        function openSettingsModal() {
          if (inputCustomSec) inputCustomSec.value = twoRevTotalSec;
          modalSettings.classList.add('open');
        }
        function closeSettingsModal() { modalSettings.classList.remove('open'); }

        btnOpenSettings.addEventListener('click', openSettingsModal);
        btnCloseSettings.addEventListener('click', closeSettingsModal);
        modalSettings.addEventListener('click', (e) => {
          if (e.target === modalSettings) closeSettingsModal();
        });

        presetCards.forEach((card) => {
          card.addEventListener('click', () => {
            const sec = parseInt(card.dataset.sec, 10);
            setDurationSec(sec);
          });
        });

        if (btnApplyCustomSec && inputCustomSec) {
          btnApplyCustomSec.addEventListener('click', () => {
            const val = parseInt(inputCustomSec.value, 10);
            setDurationSec(val);
          });
          inputCustomSec.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              const val = parseInt(inputCustomSec.value, 10);
              setDurationSec(val);
            }
          });
        }

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && isRunning) {
            lastTimestamp = performance.now();
            requestWakeLock();
          }
        });

        // Initial Mount
        applyTheme(currentTheme);
        renderTicks();
        updateFullUI();
        renderHandAndArc();

        // Safe Service Worker registration
        if ('serviceWorker' in navigator && window.self === window.top) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      })();
    </script>
  </body>
</html>
